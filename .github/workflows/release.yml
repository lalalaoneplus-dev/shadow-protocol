name: Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" }

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          npx electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE" }

      - name: Install and launch test
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $outputDir = [string]$package.build.directories.output
          $installers = @(Get-ChildItem -LiteralPath $outputDir -Filter '*Setup*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one Setup installer in $outputDir; found $($installers.Count)" }
          $installer = $installers[0]
          $programsDir = Join-Path $env:LOCALAPPDATA 'Programs'
          $installDir = Join-Path $programsDir ([string]$package.productName)
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          Write-Host "Contents of $programsDir (depth 2)"
          if (Test-Path -LiteralPath $programsDir) {
            Get-ChildItem -LiteralPath $programsDir -Recurse -Depth 2 -Force | Format-Table FullName, Length -AutoSize
          } else {
            Write-Host "Programs directory is absent: $programsDir"
          }
          $appPath = Join-Path $installDir "$($package.productName).exe"
          if (-not (Test-Path -LiteralPath $appPath)) { throw "Installed app not found at $appPath" }
          $app = Start-Process -FilePath $appPath -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) {
            Write-Host "Installed app exit code: $($app.ExitCode)"
            throw "Installed app exited during the 15-second launch test"
          }
          taskkill.exe /PID $app.Id /T /F
          if ($LASTEXITCODE -ne 0) { throw "taskkill failed with exit code $LASTEXITCODE" }
          $installPrefix = "$installDir\"
          function Get-InstalledProcesses {
            @(Get-Process | Where-Object {
              try {
                $processPath = $_.Path
                $processPath -and $processPath.StartsWith($installPrefix, [StringComparison]::OrdinalIgnoreCase)
              } catch {
                $false
              }
            })
          }
          $uninstallExitCode = 'not started'
          function Fail-Uninstall {
            param([string]$Reason)
            Write-Host "Uninstaller exit code: $uninstallExitCode"
            Write-Host "Remaining contents of $installDir"
            if (Test-Path -LiteralPath $installDir) {
              Get-ChildItem -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue |
                Select-Object FullName, Length, Attributes | Format-List | Out-String -Width 4096 | Write-Host
            } else {
              Write-Host '(folder absent)'
            }
            Write-Host "Processes running from $installDir"
            $remainingProcesses = @(Get-InstalledProcesses)
            if ($remainingProcesses.Count -gt 0) {
              $remainingProcesses | Select-Object Id, ProcessName, Path |
                Format-List | Out-String -Width 4096 | Write-Host
            } else {
              Write-Host '(none)'
            }
            throw $Reason
          }
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            if (@(Get-InstalledProcesses).Count -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if (@(Get-InstalledProcesses).Count -ne 0) { Fail-Uninstall "Processes still running from $installDir after 20 seconds" }
          $uninstallers = @(Get-ChildItem -LiteralPath $installDir -Filter 'Uninstall*.exe' -File)
          if ($uninstallers.Count -ne 1) { Fail-Uninstall "Expected one uninstaller in $installDir; found $($uninstallers.Count)" }
          $uninstaller = $uninstallers[0]
          # NSIS removes INSTDIR; run a temp copy with _?= to keep it from spawning another uninstaller.
          $tempUninstaller = Join-Path $env:RUNNER_TEMP ("ShadowProtocol-Uninstall-{0}.exe" -f [guid]::NewGuid())
          try {
            Copy-Item -LiteralPath $uninstaller.FullName -Destination $tempUninstaller
            $uninstall = Start-Process -FilePath $tempUninstaller -ArgumentList @('/S', '/currentuser', "_?=$installDir") -Wait -PassThru
            $uninstallExitCode = $uninstall.ExitCode
          } catch {
            Fail-Uninstall "Uninstaller could not run: $($_.Exception.Message)"
          } finally {
            Remove-Item -LiteralPath $tempUninstaller -Force -ErrorAction SilentlyContinue
          }
          if ($uninstallExitCode -ne 0) { Fail-Uninstall "Uninstaller failed with exit code $uninstallExitCode" }
          for ($attempt = 0; $attempt -lt 90 -and (Test-Path -LiteralPath $appPath); $attempt++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $appPath) { Fail-Uninstall "Uninstaller left the app executable at $appPath" }
          for ($attempt = 0; $attempt -lt 30 -and (Test-Path -LiteralPath $installDir); $attempt++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path -LiteralPath $installDir) { Fail-Uninstall "Uninstaller left the install folder at $installDir" }
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowProtocol-Setup
          path: ${{ steps.installer.outputs.installer }}
          if-no-files-found: error

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_PATH: ${{ steps.installer.outputs.installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version") { throw "Tag $tag does not match package version v$version" }
          $expectedName = "ShadowProtocol-Setup-$version.exe"
          if ((Split-Path -Path $env:INSTALLER_PATH -Leaf) -ne $expectedName) {
            throw "Installer name does not match $expectedName"
          }
          $notes = ((Get-Content -LiteralPath README.md -Raw) -split '\r?\n\r?\n')[1].Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) { throw 'README intro is empty' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $viewExitCode = $LASTEXITCODE
          if ($viewExitCode -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Shadow Protocol $version" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }
          gh release upload $tag $env:INSTALLER_PATH --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }

      - name: List installer output on failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = 'dist-installer'
          if (Test-Path -LiteralPath package.json) {
            $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
            $outputDir = [string]$package.build.directories.output
          }
          if (Test-Path -LiteralPath $outputDir) {
            Write-Host "Contents of $outputDir"
            Get-ChildItem -LiteralPath $outputDir -Recurse -Force | Format-Table FullName, Length -AutoSize
          } else {
            Write-Host "Output directory is absent: $outputDir"
          }
